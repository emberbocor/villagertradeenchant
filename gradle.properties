org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Vanilla Minecraft (NeoForm) used to compile the common module. See https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
neo_version=21.1.259
# The lowest NeoForge version the mod declares support for (21.1.4 adds ItemStack#supportsEnchantment).
# Verify with: ./gradlew :neoforge:compileJava "-Pneo_version=21.1.4"
neo_version_range=[21.1.4,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# NightConfig is shipped by NeoForge (3.8.0 in NeoForge 21.1.4), the common module only compiles against it.
night_config_version=3.8.0

mod_id=villagertradeenchant
mod_name=Villager Trade Enchant
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.villagertradeenchant
