org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: put classes and resources of the Forge module in one directory, required by Forge dev runs.
net.minecraftforge.gradle.merge-source-sets=true

parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20
minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
# Vanilla Minecraft (NeoForm) used to compile the common module. See https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.11-20251209.172050
neo_version=21.11.45
# The lowest NeoForge version the mod declares support for (the first stable 21.11 release). Verify with: ./gradlew :neoforge:compileJava "-Pneo_version=21.11.42"
neo_version_range=[21.11.42,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Fabric. The jar is compiled against minecraft_version and only supports Minecraft 1.21.11.
fabric_loader_version=0.19.5
# Minimum Fabric Loader, the one the minimum Fabric API requires.
fabric_loader_version_range=>=0.17.3
fabric_api_version=0.141.6+1.21.11
# Minimum Fabric API, the first build for the 1.21.11 release. Verify with: ./gradlew :fabric:compileJava "-Pfabric_api_version=0.139.5+1.21.11"
# Build metadata (+1.21.11) is ignored when Fabric compares versions.
fabric_api_version_range=>=0.139.5
fabric_minecraft_version_range=1.21.11
fabric_minecraft_label=1.21.11

# Forge. The minimum is the lowest 1.21.11 build that compiles (61.0.0 fails while Forge recompiles Minecraft).
# Verify with: ./gradlew :forge:compileJava "-Pforge_version=61.0.1"
forge_minecraft_version=1.21.11
forge_version=61.2.1
forge_version_range=[61.0.1,)
forge_loader_version_range=[61,)

# NightConfig is shipped by NeoForge and Forge; the Fabric jar bundles this version.
night_config_version=3.8.0

mod_id=villagertradeenchant
mod_name=Villager Trade Enchant
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.villagertradeenchant
