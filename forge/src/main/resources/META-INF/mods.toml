modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/emberbocor/villagertradeenchant/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/emberbocor/villagertradeenchant"
authors="emberbocor"
description='''
Adds an Enchanter villager that enchants your items for a configurable price.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Villager Enchanter also uses the enchanting table as a villager job site. Forge has no incompatible type:
# an installed optional dependency outside its range stops loading with an error, and no version is below 0.
[[dependencies.${mod_id}]]
    modId="villager_enchanter"
    mandatory=false
    versionRange="(,0)"
    ordering="NONE"
    side="BOTH"
